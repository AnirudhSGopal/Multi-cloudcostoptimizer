services:
  backend:
    build:
      context: ./backend/securevault
    env_file:
      - ./backend/securevault/.env
    environment:
      FLASK_ENV: development
      DATABASE_URL: sqlite:////app/instance/securevault.db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - backend_instance:/app/instance
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  celery:
    build:
      context: ./backend/securevault
    env_file:
      - ./backend/securevault/.env
    environment:
      FLASK_ENV: development
      DATABASE_URL: sqlite:////app/instance/securevault.db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    command: ["celery", "-A", "wsgi.celery", "worker", "--loglevel=INFO"]
    volumes:
      - backend_instance:/app/instance
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  backend_instance:
  redis_data:
